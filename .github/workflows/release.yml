name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  CSC_IDENTITY_AUTO_DISCOVERY: false
  SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
  SHARP_INSTALL_FALLBACK: "1"
  npm_config_include: optional

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxtst-dev libpng-dev \
            libxext-dev libxi-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxdamage-dev \
            libxt-dev libxkbfile-dev libxss-dev \
            libasound2 libgbm1 libnss3 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 \
            libdbus-1-3 libxcb1 libxkbcommon0 \
            libpango-1.0-0 libcairo2 libatspi2.0-0 \
            build-essential zlib1g-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          xcode-select --install 2>/dev/null || true
          brew install nasm 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --include=optional
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SHARP_INSTALL_FALLBACK: "1"

      - name: Generate app icons
        run: npm run generate:icons

      - name: Build Electron app
        run: npm run build

      - name: Build for ${{ matrix.platform }}
        run: npm run dist:${{ matrix.platform }}
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
          SHARP_INSTALL_FALLBACK: "1"

      - name: List release files
        run: node -e "const fs=require('fs'); const path=require('path'); function walk(dir){const items=fs.readdirSync(dir); items.forEach(i=>{const p=path.join(dir,i); const s=fs.statSync(p); console.log(s.size.toString().padStart(10),p); if(s.isDirectory())walk(p);});} walk('release');"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: release/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List all files
        run: find release-artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/mac-build/*.dmg
            release-artifacts/win-build/*Setup*.exe
            release-artifacts/linux-build/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
